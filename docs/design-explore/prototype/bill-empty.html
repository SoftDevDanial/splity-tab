<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split</title>
<style>
/*
  Split design system. Locked from round 1 direction C, "Working shown".
  Every golden screen inlines this file verbatim. Change it here and in every golden together.

  Colour rule: ink is for content and actions. The one accent (green) marks only the line that
  proves the split adds up. The double rule belongs to the receipt Total alone.
  Shape rule: one radius (6px) on every control, the panel and the dialog.
  One light theme. No dark mode (brief: theme switcher is a non-goal).
*/
:root {
  /* Colour roles */
  --page: #EEF0EE;          /* page background */
  --surface: #FBFCFB;       /* the bill panel, the note, the dialog */
  --field: #FDFEFD;         /* fill of inputs, outline buttons, toggles (off) */
  --ink: #141917;           /* text, primary fill, toggles (on), rules, focus ring */
  --ink-hover: #2A302D;     /* primary button hover fill */
  --ink-muted: #4A524E;     /* secondary text, operators, hints, icons in outline buttons */
  --ink-disabled: #9AA19D;  /* text and icons of disabled controls */
  --on-ink: #F3F5F4;        /* text on ink fills */
  --line: #C9CECB;          /* hairlines between items, disabled button border */
  --line-strong: #78807C;   /* control borders */
  --hover: #E3E7E4;         /* hover fill of outline controls */
  --accent: #0B6B4D;        /* the "Adds up to" check row only */
  --error: #B42318;         /* amount error text and border, copy failure text */
  --scrim: rgba(20, 25, 23, 0.48); /* dialog backdrop (ink at 48%) */

  /* Type */
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --text-caption: 13px; --leading-caption: 18px;  /* shares table column heads */
  --text-small: 14px;   --leading-small: 20px;    /* hints, errors, status, table secondary cells */
  --text-control: 15px; --leading-control: 20px;  /* buttons, toggles, labels, working lines, row names */
  --text-body: 16px;    --leading-body: 24px;     /* body copy, every input (16px stops iOS zoom) */
  --text-heading: 18px; --leading-heading: 24px;  /* block headings, shares, Total label, dialog title */
  --text-brand: 22px;   --leading-brand: 28px;    /* wordmark */
  --text-total: 26px;   --leading-total: 32px;    /* the Total amount */
  --weight-regular: 400;
  --weight-semibold: 600;
  --weight-bold: 700;

  /* Spacing scale (4px base) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-16: 64px;

  /* Shape, borders, rules */
  --radius: 6px;
  --border: 1px;
  --rule-panel: 2px;   /* ink rule on top of the bill panel (phone) */
  --rule-total: 3px;   /* double rule under the Total amount */
  --focus-width: 2px;
  --focus-offset: 2px;

  /* Sizes */
  --target: 44px;      /* minimum touch target */
  --target-large: 48px;
  --icon: 20px;
  --icon-small: 18px;
  --op: 20px;          /* operator gutter (+, =) */
  --price-width: 96px; /* item price field, phone */

  /* Layout */
  --gutter: 16px;
  --column: 560px;     /* single column, 600 to 1023 px */
  --page-max: 1104px;  /* two columns, 1024 px and up */
  --panel: 420px;      /* right column (bill panel) */

  /* Motion */
  --duration: 120ms;
  --ease: ease;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: var(--font);
  font-size: var(--text-body);
  line-height: var(--leading-body);
  font-weight: var(--weight-regular);
  font-variant-numeric: tabular-nums lining-nums;
  -webkit-font-smoothing: antialiased;
}
h1, h2, p, dl, dd { margin: 0; }
button, input { font: inherit; color: inherit; }
input::placeholder { color: var(--ink-muted); opacity: 1; }
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.ph { width: var(--icon); height: var(--icon); flex: none; fill: currentColor; }

/* Focus: one visible ring everywhere */
:focus-visible { outline: var(--focus-width) solid var(--ink); outline-offset: var(--focus-offset); }

/* ---------- Header ---------- */
.bar {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
  padding: var(--space-3) var(--gutter) 0;
}
.wordmark {
  font-size: var(--text-brand); line-height: var(--leading-brand);
  font-weight: var(--weight-bold); letter-spacing: -0.01em;
}

/* ---------- Note banner (dismissible) ---------- */
.note-wrap { padding: 0 var(--gutter); }
.note {
  display: flex; align-items: flex-start; gap: var(--space-2);
  margin-top: var(--space-4);
  padding-left: var(--space-4);
  background: var(--surface);
  border: var(--border) solid var(--line-strong); border-radius: var(--radius);
}
.note p { flex: 1 1 auto; min-width: 0; align-self: center; padding: var(--space-2) 0; }
.note .icon-btn { margin: 0; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: var(--target); padding: 0 var(--space-4);
  border: var(--border) solid transparent; border-radius: var(--radius);
  background: none; cursor: pointer;
  font-size: var(--text-control); line-height: var(--leading-control);
  font-weight: var(--weight-semibold); white-space: nowrap;
}
.btn-outline { background: var(--field); border-color: var(--line-strong); color: var(--ink); }
.btn-outline:hover { background: var(--hover); }
.btn-outline .ph { width: var(--icon-small); height: var(--icon-small); color: var(--ink-muted); }
.btn-primary { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.btn-primary:hover { background: var(--ink-hover); border-color: var(--ink-hover); }
.btn-large { min-height: var(--target-large); font-size: var(--text-body); line-height: var(--leading-body); }
.btn-block { width: 100%; }
.btn:disabled { cursor: not-allowed; color: var(--ink-disabled); }
.btn-outline:disabled { background: transparent; border-color: var(--line); }
.btn-outline:disabled .ph { color: var(--ink-disabled); }

.icon-btn {
  display: grid; place-items: center; flex: none;
  width: var(--target); height: var(--target); padding: 0;
  border: 0; border-radius: var(--radius); background: none;
  color: var(--ink-muted); cursor: pointer;
}
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn:disabled { cursor: not-allowed; background: none; color: var(--ink-disabled); }

.btn:not(:disabled):active,
.icon-btn:not(:disabled):active,
.tap:active { transform: translateY(1px); }

/* ---------- Fields (text, money, percent) ---------- */
.field {
  display: flex; align-items: center; min-width: 0; min-height: var(--target);
  background: var(--field);
  border: var(--border) solid var(--line-strong); border-radius: var(--radius);
}
.field input {
  flex: 1 1 auto; min-width: 0; height: calc(var(--target) - 2 * var(--border)); padding: 0 var(--space-3);
  border: 0; background: transparent;
  font-size: var(--text-body); line-height: var(--leading-body);
}
.field input:focus { outline: none; }
.field:has(input:focus-visible) { outline: var(--focus-width) solid var(--ink); outline-offset: var(--focus-offset); }
@supports not selector(:has(*)) {
  .field:focus-within { outline: var(--focus-width) solid var(--ink); outline-offset: var(--focus-offset); }
}
/* Error: the border thickens to 2px in the error colour without moving the layout */
.field:has(input[aria-invalid="true"]) { border-color: var(--error); box-shadow: inset 0 0 0 1px var(--error); }

/* Money: "RM" unit before a right-aligned figure. Percent: right-aligned figure, then "%".
   The 2px gap keeps the figure and its % sign together, as they are written. */
.money .unit { padding-left: var(--space-2); color: var(--ink-muted); }
.money input { text-align: right; padding: 0 var(--space-2) 0 var(--space-1); }
.percent input { text-align: right; padding: 0 2px 0 var(--space-3); }
.percent .unit { padding-right: var(--space-3); color: var(--ink-muted); }

.label {
  display: block; margin-bottom: var(--space-2);
  font-size: var(--text-control); line-height: var(--leading-control); font-weight: var(--weight-semibold);
}
.hint {
  margin-top: var(--space-2);
  font-size: var(--text-small); line-height: var(--leading-small); color: var(--ink-muted);
}
.error {
  margin-top: var(--space-2);
  font-size: var(--text-small); line-height: var(--leading-small);
  font-weight: var(--weight-semibold); color: var(--error);
}

/* ---------- Layout ---------- */
.layout { padding-bottom: var(--space-10); }
.inputs { padding: 0 var(--gutter); }
.block { margin-top: var(--space-6); }
.block-title {
  margin-bottom: var(--space-3);
  font-size: var(--text-heading); line-height: var(--leading-heading); font-weight: var(--weight-bold);
}
/* One cell grid for people, the subtotal and the charges, so their columns line up */
.cells {
  list-style: none; margin: 0; padding: 0;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--space-2);
}

/* ---------- Person row ---------- */
/* The remove button sits over the field border so its hit area is a full 44 x 44 */
.person .icon-btn {
  align-self: stretch; height: var(--target); margin: -1px -1px -1px 0;
  border: var(--border) solid var(--line-strong); border-left-color: var(--line);
  border-radius: 0 var(--radius) var(--radius) 0;
}
.person .icon-btn:focus-visible { outline-offset: -3px; }
.cells .btn { width: 100%; }

/* ---------- Mode switch ---------- */
.mode {
  margin: var(--space-6) 0 0; padding: 0; min-width: 0;
  display: grid; grid-template-columns: 1fr 1fr;
  border: var(--border) solid var(--line-strong); border-radius: var(--radius);
  background: var(--field); overflow: hidden;
}
.mode input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.mode label {
  display: flex; align-items: center; justify-content: center;
  min-height: var(--target);
  font-size: var(--text-control); line-height: var(--leading-control); font-weight: var(--weight-semibold);
  cursor: pointer;
}
.mode label + input + label { border-left: var(--border) solid var(--line-strong); }
.mode input:checked + label { background: var(--ink); color: var(--on-ink); }
.mode input:not(:checked) + label:hover { background: var(--hover); }
/* Inset double ring: a light band shows on the ink segment, an ink band on the light one */
.mode input:focus-visible + label { box-shadow: inset 0 0 0 3px var(--field), inset 0 0 0 5px var(--ink); }
.mode:has(input:focus-visible) { outline: var(--focus-width) solid var(--ink); outline-offset: var(--focus-offset); }

/* ---------- Item row ---------- */
.items { list-style: none; margin: 0; padding: 0; }
.item { padding: var(--space-4) 0; border-top: var(--border) solid var(--line); }
.item:first-child { border-top: 0; padding-top: 0; }
.item-line {
  display: grid; grid-template-columns: minmax(0, 1fr) var(--price-width) var(--target);
  gap: var(--space-2); align-items: center;
}
/* An amount error under a price spans name and price and ends under the price field */
.item-line .error { grid-column: 1 / 3; margin-top: 0; text-align: right; }

/* ---------- Person toggle ---------- */
.who { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }
.tap {
  display: inline-flex; align-items: center;
  min-height: var(--target); min-width: var(--target); padding: 0 var(--space-3);
  border: var(--border) solid var(--line-strong); border-radius: var(--radius);
  background: var(--field); color: var(--ink);
  font-size: var(--text-control); line-height: var(--leading-control); font-weight: var(--weight-semibold);
  cursor: pointer;
}
.tap:hover { background: var(--hover); }
.tap[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }

/* ---------- The bill panel (summary + shares) ---------- */
.tape {
  margin-top: var(--space-8);
  padding: var(--space-5) var(--gutter) var(--space-6);
  background: var(--surface);
  border-top: var(--rule-panel) solid var(--ink);
  border-bottom: var(--border) solid var(--line);
}
.tape-title { font-size: var(--text-heading); line-height: var(--leading-heading); font-weight: var(--weight-bold); }
.tape-section + .tape-section { margin-top: var(--space-8); }

.sum { margin-top: var(--space-2); }
.row {
  position: relative;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: var(--space-2);
  align-items: baseline; padding: var(--space-1) 0;
}
.row dt { display: flex; align-items: baseline; }
.op {
  flex: none; width: var(--op); margin-right: var(--space-2);
  color: var(--ink-muted); font-weight: var(--weight-semibold); text-align: center;
}
.amt { text-align: right; white-space: nowrap; }
.work {
  grid-column: 1 / -1; padding-left: calc(var(--op) + var(--space-2));
  font-size: var(--text-control); line-height: var(--leading-control); color: var(--ink-muted);
}
.total { margin-top: var(--space-3); padding-top: var(--space-3); }
.total::before {
  content: ""; position: absolute; top: 0; right: 0; left: calc(var(--op) + var(--space-2));
  border-top: var(--border) solid var(--ink);
}
.total dt { font-size: var(--text-heading); font-weight: var(--weight-bold); }
.total dd { font-size: var(--text-total); line-height: var(--leading-total); font-weight: var(--weight-bold); }
.final { display: inline-block; border-bottom: var(--rule-total) double currentColor; line-height: 1.15; }

/* Shares table */
.shares { width: 100%; margin-top: var(--space-2); border-collapse: collapse; }
.shares th, .shares td {
  padding: var(--space-2) 0 var(--space-2) var(--space-2);
  text-align: right; white-space: nowrap; font-weight: var(--weight-regular);
}
.shares thead th {
  padding-top: 0; padding-bottom: var(--space-1); vertical-align: bottom;
  font-size: var(--text-caption); line-height: var(--leading-caption);
  font-weight: var(--weight-semibold); color: var(--ink-muted);
}
.shares thead .op { display: inline; width: auto; margin-right: var(--space-1); }
.shares tbody th, .shares tfoot th {
  text-align: left; padding-left: calc(var(--op) + var(--space-2));
  font-size: var(--text-control); font-weight: var(--weight-semibold); color: var(--ink);
}
.shares tbody th { white-space: normal; overflow-wrap: anywhere; }
.shares td { font-size: var(--text-small); color: var(--ink-muted); }
.shares td.share { font-size: var(--text-heading); font-weight: var(--weight-bold); color: var(--ink); }
.shares tfoot th, .shares tfoot td { padding-top: var(--space-3); padding-bottom: 0; vertical-align: baseline; }
.shares tfoot td { border-top: var(--border) solid var(--ink); }
.shares tfoot th {
  position: relative; color: var(--accent);
  background: linear-gradient(var(--ink), var(--ink)) no-repeat calc(var(--op) + var(--space-2)) 0 / 100% 1px;
}
/* top: 14px centres the 18px check on the first line of the label */
.shares tfoot th .ph {
  position: absolute; left: 0; top: 14px; width: var(--icon-small); height: var(--icon-small); color: var(--accent);
}
.shares tfoot td.share { color: var(--accent); }

/* Result message (replaces the shares when there is nothing to split yet) */
.result-msg { margin-top: var(--space-2); }

.copy { margin-top: var(--space-6); }

/* ---------- Status message ---------- */
.status {
  margin-top: var(--space-2); text-align: center;
  font-size: var(--text-small); line-height: var(--leading-small); font-weight: var(--weight-semibold);
  color: var(--ink);
}
.status:empty { display: none; }
.status-failure { color: var(--error); }

/* ---------- Dialog ---------- */
/* The app opens it with showModal() and styles dialog::backdrop with var(--scrim).
   A static golden cannot open a modal, so it draws the same scrim as .backdrop.
   While a dialog is open the app root (.app, which wraps the header and main) is clipped to the
   viewport, so the page behind the dialog does not scroll. */
html:has(dialog[open]) .app { position: relative; height: 100dvh; overflow: hidden; }
.backdrop { position: fixed; inset: 0; background: var(--scrim); }
dialog::backdrop { background: var(--scrim); }
.dialog {
  position: fixed; inset: 0; margin: auto;
  width: min(400px, calc(100% - 2 * var(--gutter))); max-width: none; height: fit-content;
  padding: var(--space-6);
  background: var(--surface); color: var(--ink);
  border: var(--border) solid var(--ink); border-radius: var(--radius);
}
.dialog-title { font-size: var(--text-heading); line-height: var(--leading-heading); font-weight: var(--weight-bold); }
.dialog-text { margin-top: var(--space-2); color: var(--ink-muted); }
.dialog-actions { display: flex; flex-direction: column; gap: var(--space-2); margin-top: var(--space-6); }

/* ---------- Wider screens ---------- */
@media (min-width: 600px) {
  .bar, .layout, .note-wrap { max-width: var(--column); margin-left: auto; margin-right: auto; }
  .bar { padding-top: var(--space-5); }
  :root { --price-width: 120px; }
  .tape {
    margin: var(--space-8) var(--gutter) 0;
    border: var(--border) solid var(--ink); border-radius: var(--radius);
    padding: var(--space-6);
  }
  .dialog-actions { flex-direction: row; justify-content: flex-end; }
}
@media (min-width: 1024px) {
  :root { --gutter: 32px; }
  .bar, .note-wrap { max-width: var(--page-max); }
  .bar { padding-top: var(--space-8); }
  .layout {
    max-width: var(--page-max);
    display: grid; grid-template-columns: minmax(0, 1fr) var(--panel); column-gap: var(--space-16);
    align-items: start;
    padding: 0 var(--gutter) var(--space-16);
  }
  .inputs { padding: 0; }
  .tape { position: sticky; top: var(--space-6); margin: var(--space-6) 0 0; }
}

/* ---------- Motion ---------- */
/* Colour changes only, and only when the user has not asked for reduced motion */
@media (prefers-reduced-motion: no-preference) {
  .btn, .tap, .icon-btn, .mode label { transition: background-color var(--duration) var(--ease), color var(--duration) var(--ease); }
}
</style>
</head>
<body>
<div class="app">

<header class="bar">
  <h1 class="wordmark">Split</h1>
  <button class="btn btn-outline" type="button">New bill</button>
</header>

<main class="layout">
  <div class="inputs">

    <section class="block" aria-labelledby="h-people">
      <h2 class="block-title" id="h-people">People</h2>
      <ul class="cells">
        <li class="field person">
          <input type="text" value="Person 1" maxlength="20" autocomplete="off" aria-label="Person 1 name">
          <button class="icon-btn" type="button" aria-label="Remove Person 1" disabled>
            <svg class="ph" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg>
          </button>
        </li>
        <li class="field person">
          <input type="text" value="Person 2" maxlength="20" autocomplete="off" aria-label="Person 2 name">
          <button class="icon-btn" type="button" aria-label="Remove Person 2" disabled>
            <svg class="ph" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg>
          </button>
        </li>
        <li>
          <button class="btn btn-outline" type="button">
            <svg class="ph" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"/></svg>
            Add person
          </button>
        </li>
      </ul>
    </section>

    <fieldset class="mode">
      <legend class="sr-only">Split mode</legend>
      <input type="radio" name="mode" id="mode-even" value="even" checked>
      <label for="mode-even">Even</label>
      <input type="radio" name="mode" id="mode-item" value="item">
      <label for="mode-item">By item</label>
    </fieldset>

    <section class="block" aria-labelledby="h-subtotal">
      <h2 class="block-title" id="h-subtotal"><label for="subtotal">Subtotal<span class="sr-only"> in RM</span></label></h2>
      <div class="cells">
        <span class="field money"><span class="unit" aria-hidden="true">RM</span><input id="subtotal" type="text" inputmode="decimal" value="" autocomplete="off"></span>
      </div>
    </section>

    <section class="block" aria-labelledby="h-charges">
      <h2 class="block-title" id="h-charges">Charges</h2>
      <div class="cells">
        <div>
          <label class="label" for="rate-service">Service charge<span class="sr-only"> in percent</span></label>
          <span class="field percent"><input id="rate-service" type="text" inputmode="decimal" value="10" autocomplete="off" aria-describedby="charges-hint"><span class="unit" aria-hidden="true">%</span></span>
        </div>
        <div>
          <label class="label" for="rate-sst">SST<span class="sr-only"> in percent</span></label>
          <span class="field percent"><input id="rate-sst" type="text" inputmode="decimal" value="6" autocomplete="off" aria-describedby="charges-hint"><span class="unit" aria-hidden="true">%</span></span>
        </div>
      </div>
      <p class="hint" id="charges-hint">Set a charge to 0 if your bill already includes it.</p>
    </section>

  </div>

  <div class="tape">
    <section class="tape-section" aria-labelledby="h-shares">
      <h2 class="tape-title" id="h-shares">Shares</h2>
      <p class="result-msg">Enter the subtotal to see the shares.</p>
    </section>
  </div>
</main>

</div>

<script>
// Prototype wiring added by the design flow check. Not part of the golden.
(function () {
  var links = [{"from": "bill-empty.html", "selector": "label[for=mode-item]", "to": "bill-items.html"}];
  function label(el) { return (el.getAttribute('aria-label') || el.textContent || '').replace(/\s+/g, ' ').trim(); }
  document.addEventListener('click', function (e) {
    for (var i = 0; i < links.length; i++) {
      var l = links[i];
      if (l.selector) { if (e.target.closest(l.selector)) { location.href = l.to; return; } continue; }
      if (!l.name) continue;
      var el = e.target.closest('button, a, [role=button], [role=radio], label, input');
      if (!el) continue;
      var t = label(el);
      if (l.exact ? t === l.name : t.indexOf(l.name) !== -1) { e.preventDefault(); location.href = l.to; return; }
    }
  });
  document.addEventListener('keydown', function (e) {
    links.forEach(function (l) { if (l.key && e.key === l.key) location.href = l.to; });
  });
})();
</script>
