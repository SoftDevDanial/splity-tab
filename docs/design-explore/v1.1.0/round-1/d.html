<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danial's Splity Tab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231C1C1F'/%3E%3Cpath fill='%2379B8A7' d='M1 2h8v3H1z'/%3E%3Cpath fill='%2393A1E0' d='M11 2h4v3h-4z'/%3E%3Cpath fill='%23EEECE8' d='M1 10h14v3H1z'/%3E%3C/svg%3E">
<!--
  Direction D, Share Orbit. Round 1 prototype for v1.1.0.
  The split is a shape. The shares form a segmented ring around the total and each person owns a segment.
  One dark charcoal theme, one coral accent (chosen states and the main action), one muted colour per person.
  No network. System fonts. Icons are Phosphor (MIT) paths. The ring is drawn here, it is not an icon.
-->
<style>
:root {
  /* Ground */
  --bg: #1C1C1F;
  --surface: #252529;
  --raised: #2E2E33;
  --hover: #37373D;
  --line: #36363C;
  --line-strong: #80808A;
  /* Text */
  --ink: #EEECE8;
  --ink-muted: #ABA9A4;
  --ink-faint: #6B6A70;
  /* The one accent: chosen states and the main action */
  --coral: #FF7566;
  --coral-hover: #FF8B7E;
  --on-coral: #1C1C1F;
  /* Status (errors and the save warning), never an action */
  --amber: #F2C55C;
  --amber-soft: rgba(242, 197, 92, 0.08);
  /* People: muted, calm, distinct. Text on them uses --on-person */
  --on-person: #1C1C1F;
  --p1: #79B8A7;
  --p2: #93A1E0;
  --p3: #C99FCF;
  --p4: #7DB4D8;
  --p5: #A9C17F;
  --p6: #D4B98A;
  --p7: #8FC9C3;
  --p8: #B3A3DD;
  --p9: #A7B2C2;
  --p10: #C5C287;
  --p11: #9FC6A1;
  --p12: #C9AFC0;
  --scrim: rgba(12, 12, 14, 0.66);
  --shadow: 0 24px 64px rgba(8, 8, 10, 0.5);

  /* Type */
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --fs-total: 32px;
  --fs-total-long: 25px;
  --fs-callout: 20px;
  --fs-title: 20px;
  --fs-word: 19px;
  --fs-share: 18px;
  --fs-body: 16px;
  --fs-control: 15px;
  --fs-small: 14px;
  --fs-caption: 13px;
  --fs-tag: 12px;

  /* Shape. Pills for every control you press, 12 for fields, 20 for panels */
  --r-pill: 999px;
  --r-field: 12px;
  --r-panel: 20px;

  /* Space, 4 px base */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 20px;
  --s6: 24px;
  --s7: 28px;
  --s8: 32px;
  --s10: 40px;
  --s16: 64px;

  --tap: 44px;
}
@media (min-width: 1024px) {
  :root { --fs-total: 44px; --fs-total-long: 36px; }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 var(--fs-body)/1.5 var(--font);
  font-variant-numeric: tabular-nums lining-nums;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.ph { width: 20px; height: 20px; fill: currentColor; flex: none; }
.ph.sm { width: 16px; height: 16px; }
[hidden] { display: none !important; }

:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
input:focus-visible { outline: none; }

/* ---------- Header ---------- */
.topbar { border-bottom: 1px solid var(--line); }
.bar {
  max-width: 1280px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
  min-height: 60px; padding: var(--s2) var(--s4);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 26px; height: 26px; flex: none; }
.mark .m-s1 { fill: var(--p1); }
.mark .m-s2 { fill: var(--p2); }
.mark .m-t { fill: var(--ink); }
.word { font-size: var(--fs-word); font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  min-height: var(--tap); padding: 0 var(--s4);
  border-radius: var(--r-pill); border: 1px solid transparent;
  font-size: var(--fs-control); font-weight: 600; line-height: 20px; white-space: nowrap;
  background: transparent; color: var(--ink);
}
.btn-primary { background: var(--coral); color: var(--on-coral); }
.btn-primary:hover { background: var(--coral-hover); }
.btn-ghost { border-color: var(--line-strong); }
.btn-ghost:hover:not(:disabled) { background: var(--hover); }
.btn-ghost .ph { color: var(--ink-muted); }
.btn-chip { background: var(--raised); border-color: var(--line); padding: 0 var(--s3) 0 var(--s4); }
.btn-chip:hover { background: var(--hover); }
.btn-chip .ph { color: var(--ink-muted); }
.btn-block { width: 100%; }
.btn-lg { min-height: 48px; font-size: var(--fs-body); }
.btn:disabled { color: var(--ink-faint); border-color: var(--line); cursor: not-allowed; }
.btn:disabled .ph { color: var(--ink-faint); }
.btn:active:not(:disabled), .icon-btn:active:not(:disabled), .tap:active, .choice:active:not(:disabled) { transform: translateY(1px); }
.icon-btn {
  width: var(--tap); height: var(--tap); flex: none;
  display: grid; place-items: center;
  border-radius: var(--r-pill); border: 0; background: transparent; color: var(--ink-muted);
}
.icon-btn:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.icon-btn:disabled { color: var(--ink-faint); cursor: not-allowed; }

/* ---------- Page layout ---------- */
.layout {
  max-width: 1280px; margin: 0 auto;
  padding: var(--s3) var(--s4) 72px;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s6);
}
.notes { display: grid; gap: var(--s2); }
.notes:empty { display: none; }
@media (min-width: 1024px) {
  .bar { padding: var(--s2) var(--s6); min-height: 64px; }
  .layout {
    grid-template-columns: minmax(0, 1fr) 400px;
    padding: var(--s6) var(--s6) var(--s16);
    align-items: start; column-gap: var(--s8); row-gap: var(--s4);
  }
  .notes { grid-column: 1 / -1; }
  .orbit { position: sticky; top: var(--s6); }
}

/* ---------- Notes (S5, S6) ---------- */
.note {
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s1) var(--s1) var(--s1) var(--s4);
  border-radius: 16px; border: 1px solid var(--line-strong); background: var(--surface);
  font-size: var(--fs-control);
}
.note > .ph { color: var(--ink-muted); }
.note p { flex: 1; padding: 10px 0; }
.note.warn { border-color: var(--amber); background: var(--amber-soft); padding-right: var(--s4); }
.note.warn > .ph { color: var(--amber); }

/* ---------- The orbit panel ---------- */
.orbit {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-panel);
  padding: var(--s4);
  display: grid; grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "ring" "res" "act" "bill";
  gap: var(--s4);
  min-width: 0;
}
@media (min-width: 1024px) {
  .orbit {
    padding: var(--s6);
    grid-template-columns: 232px minmax(0, 1fr);
    grid-template-areas: "ring ring" "bill res" "bill act";
    column-gap: var(--s8); row-gap: var(--s4);
  }
}
.ring-wrap { grid-area: ring; position: relative; min-width: 0; }
#ring { display: block; width: 100%; overflow: visible; }
#ring text { font-family: var(--font); }
#ring .seg { fill: none; stroke-linecap: butt; }
#ring .ghost { fill: none; stroke: var(--hover); stroke-dasharray: 2 5; }
#ring .ini { fill: var(--on-person); font-size: var(--fs-tag); font-weight: 700; }
#ring .sen-dot { fill: var(--coral); }
#ring .leader { fill: none; stroke-width: 1.5; }
#ring .co-name { fill: var(--ink-muted); font-size: var(--fs-small); font-weight: 600; }
#ring .co-sen { fill: var(--coral); font-size: var(--fs-caption); font-weight: 600; }
#ring .co-amt { fill: var(--ink); font-size: var(--fs-callout); font-weight: 600; letter-spacing: -0.01em; }
#ring[data-focus] .seg:not(.on), #ring[data-focus] .leader:not(.on) { opacity: 0.28; }

.centre {
  position: absolute; left: 50%; transform: translate(-50%, -50%);
  text-align: center; pointer-events: none;
}
.c-label { display: block; font-size: var(--fs-caption); font-weight: 600; color: var(--ink-muted); }
.c-fig { display: block; font-size: var(--fs-total); font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; white-space: nowrap; }
.c-fig.long { font-size: var(--fs-total-long); }
.c-unit { font-size: var(--fs-control); font-weight: 600; color: var(--ink-muted); letter-spacing: 0; margin-right: var(--s1); }
.c-msg { display: block; font-size: var(--fs-small); color: var(--ink-muted); line-height: 1.4; }

/* Shares list. Phone, two lines a person. Desktop, a table with columns */
.res { grid-area: res; min-width: 0; }
.lhead { display: none; }
.legend { list-style: none; margin: 0; padding: 0; }
.row {
  display: grid; grid-template-columns: 36px minmax(0, 1fr) auto;
  grid-template-areas: "g nm sh" "g wk sh";
  column-gap: var(--s3); align-items: center;
  padding: var(--s2) var(--s1); border-top: 1px solid var(--line);
  min-height: 56px; border-radius: 10px;
}
.legend .row:first-child { border-top: 0; }
.legend.item .row, .foot.item { grid-template-areas: "g nm sh" "g wk wk"; row-gap: 2px; }
.legend.item .sh, .foot.item .sh { align-self: end; }
.legend.item .wk, .foot.item .wk { align-self: start; }
.legend.even .row, .foot:not(.item) { grid-template-areas: "g nm sh"; }
.row.on { background: var(--raised); }
.glyph { grid-area: g; width: 36px; height: 36px; display: block; }
.glyph .g-track { fill: none; stroke: var(--line); }
.glyph .g-arc { fill: none; }
.glyph text { fill: var(--ink); font-size: var(--fs-tag); font-weight: 700; font-family: var(--font); }
.nm { grid-area: nm; font-size: var(--fs-control); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sen { color: var(--coral); font-size: var(--fs-caption); font-weight: 600; margin-left: 6px; }
.wk { grid-area: wk; font-size: var(--fs-caption); color: var(--ink-muted); white-space: nowrap; }
.sh { grid-area: sh; font-size: var(--fs-share); font-weight: 600; text-align: right; white-space: nowrap; }
.foot { border-top: 1px solid var(--line-strong); border-radius: 0; margin-top: var(--s1); }
.foot .g-check { grid-area: g; width: 36px; height: 36px; display: grid; place-items: center; color: var(--ink); }
.foot .nm { color: var(--ink); }
.result-msg { font-size: var(--fs-body); color: var(--ink); padding: var(--s2) 0; }
@media (min-width: 1024px) {
  .lhead {
    display: grid; grid-template-columns: 36px minmax(0, 1fr) 100px 88px 108px; column-gap: var(--s3);
    padding: 0 var(--s1) var(--s1); font-size: var(--fs-caption); font-weight: 600; color: var(--ink-muted);
  }
  .lhead span:nth-child(n+3) { text-align: right; }
  .legend.item .row, .res .foot.item {
    grid-template-columns: 36px minmax(0, 1fr) 100px 88px 108px;
    grid-template-areas: "g nm it ch sh";
    min-height: 48px; padding-top: var(--s1); padding-bottom: var(--s1);
  }
  .legend.item .wk, .res .foot.item .wk { display: contents; }
  .legend.item .sh, .res .foot.item .sh, .wk .it, .wk .ch { align-self: center; }
  .wk .it { grid-area: it; text-align: right; }
  .wk .ch { grid-area: ch; text-align: right; }
  .wk .op { display: none; }
  .legend.item .wk span, .foot.item .wk span { font-size: var(--fs-control); }
  .legend.item .wk .it, .legend.item .wk .ch { color: var(--ink-muted); }
}

/* Spare sen line and Copy summary */
.act { grid-area: act; display: flex; flex-direction: column; gap: var(--s3); min-width: 0; }
.spare { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--s2) var(--s3); }
.spare-count { font-size: var(--fs-small); color: var(--ink-muted); }
.spare-ctl { display: flex; flex-wrap: wrap; gap: var(--s2); justify-content: flex-end; margin-left: auto; }
.who-name { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
.copy-row { display: grid; gap: var(--s2); }
.status { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: var(--fs-small); font-weight: 600; color: var(--ink); text-align: center; }
.status.fail { color: var(--amber); }
.status:empty { display: none; }
@media (min-width: 1024px) {
  .act { flex-direction: row; align-items: flex-start; justify-content: space-between; gap: var(--s4); }
  .spare { flex: 1; justify-content: flex-start; min-height: var(--tap); }
  .copy-row { width: 220px; flex: none; }
}

/* Bill working */
.billbox { grid-area: bill; min-width: 0; border-top: 1px solid var(--line); padding-top: var(--s3); }
.billbox h3 { font-size: var(--fs-small); font-weight: 600; color: var(--ink-muted); margin-bottom: var(--s1); }
.bill { margin: 0; }
.bill > div { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); padding: 6px 0; }
.bill dt { font-size: var(--fs-small); color: var(--ink); min-width: 0; }
.bill dt .bw { display: block; font-size: var(--fs-caption); color: var(--ink-muted); }
.bill dd { margin: 0; font-size: var(--fs-control); font-weight: 600; white-space: nowrap; }
.bill .tot { border-top: 1px solid var(--line-strong); margin-top: var(--s1); padding-top: var(--s2); }
.bill .tot dt { font-weight: 600; }
@media (min-width: 1024px) {
  .billbox { border-top: 0; padding-top: 0; border-right: 1px solid var(--line); padding-right: var(--s6); }
  .billbox h3 { padding: 0 0 var(--s1); }
}

/* ---------- Editor ---------- */
.editor { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s7); align-content: start; min-width: 0; }
.block-title { display: block; font-size: var(--fs-body); font-weight: 600; margin: 0 0 var(--s3); }
.mode {
  border: 1px solid var(--line); margin: 0; padding: 3px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 3px;
  background: var(--raised); border-radius: var(--r-pill);
}
.mode label {
  position: relative; min-height: var(--tap);
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-pill); font-size: var(--fs-control); font-weight: 600; color: var(--ink-muted); cursor: pointer;
}
.mode label:hover { color: var(--ink); }
.mode input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.mode label:has(input:checked) { background: var(--hover); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--coral); }
.mode label:has(input:focus-visible) { outline: 2px solid var(--ink); outline-offset: 2px; }

.field {
  display: flex; align-items: center; min-height: var(--tap); min-width: 0;
  background: var(--raised); border: 1px solid var(--line-strong); border-radius: var(--r-field);
}
.field:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
.field input {
  flex: 1; min-width: 0; width: 100%; height: 42px; border: 0; background: transparent;
  padding: 0 var(--s3); font-size: var(--fs-body);
}
.field input::placeholder { color: var(--ink-muted); opacity: 1; }
.field .unit { padding-left: var(--s3); font-size: var(--fs-small); font-weight: 600; color: var(--ink-muted); }
.money input { text-align: right; padding-left: 6px; }
.pct input { text-align: right; padding-right: 2px; }
.pct .unit { padding: 0 var(--s3) 0 0; }
.field.invalid { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
.err { display: flex; align-items: center; gap: 6px; margin-top: var(--s2); font-size: var(--fs-small); font-weight: 600; color: var(--amber); }
.hint { margin-top: var(--s2); font-size: var(--fs-small); color: var(--ink-muted); }

.avatar {
  width: 28px; height: 28px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  background: var(--pc); color: var(--on-person); font-size: var(--fs-caption); font-weight: 700; line-height: 1;
}
.avatar.xs { width: 20px; height: 20px; font-size: 11px; }
.plist, .ilist { list-style: none; margin: 0 0 var(--s3); padding: 0; }
.plist { display: grid; gap: var(--s2); }
.person { display: grid; grid-template-columns: 28px minmax(0, 1fr) var(--tap); gap: 10px; align-items: center; }
.item { padding: var(--s3) 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; padding-top: 0; }
.item-top { display: grid; grid-template-columns: minmax(0, 1fr) 112px var(--tap); gap: var(--s2); align-items: center; }
.item .err { justify-content: flex-end; }
.who { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s2); }
.tap {
  min-height: var(--tap); display: inline-flex; align-items: center; gap: var(--s2);
  padding: 0 14px 0 var(--s2); border-radius: var(--r-pill);
  border: 1px solid var(--line-strong); background: transparent;
  font-size: var(--fs-control); font-weight: 600; color: var(--ink-muted);
}
.tap .avatar { width: 24px; height: 24px; font-size: var(--fs-tag); background: transparent; color: var(--pc); box-shadow: inset 0 0 0 2px var(--pc); }
.tap:hover { background: var(--raised); }
.tap[aria-pressed="true"] { color: var(--ink); background: var(--raised); border-color: var(--coral); box-shadow: inset 0 0 0 0.5px var(--coral); }
.tap[aria-pressed="true"] .avatar { background: var(--pc); color: var(--on-person); box-shadow: none; }
.item.needs .tap { border-style: dashed; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s3); }
.pair label { display: block; font-size: var(--fs-control); font-weight: 600; margin-bottom: var(--s2); }

/* ---------- Popups ---------- */
dialog {
  padding: 0; border: 0; background: transparent; color: var(--ink);
  max-width: none; max-height: none; overflow: visible;
}
dialog::backdrop { background: var(--scrim); }
.panel {
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-panel);
  box-shadow: var(--shadow); padding: var(--s6);
}
/* P1 spare sen. Phone, a sheet from the bottom. From 640 px, a popover under its button */
#spareDlg { position: fixed; inset: auto 0 0 0; margin: 0; width: 100%; }
#spareDlg .panel { border-radius: var(--r-panel) var(--r-panel) 0 0; border-bottom: 0; padding: var(--s3) var(--s3) var(--s6); max-height: 80dvh; overflow: auto; }
@media (min-width: 640px) {
  #spareDlg { inset: auto; width: 340px; }
  #spareDlg .panel { border-radius: var(--r-panel); border-bottom: 1px solid var(--line-strong); padding: var(--s3); }
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); padding: 0 0 var(--s2) var(--s3); }
.sheet-head h2 { font-size: var(--fs-body); font-weight: 600; }
.choices { display: grid; gap: 2px; }
.choice {
  display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: 52px;
  padding: 0 var(--s3); border: 0; border-radius: var(--r-field); background: transparent;
  text-align: left; font-size: var(--fs-body); font-weight: 600;
}
.choice:hover:not(:disabled) { background: var(--hover); }
.choice:disabled { color: var(--ink-faint); cursor: not-allowed; }
.choice .c-txt { flex: 1; min-width: 0; }
.radio { width: 20px; height: 20px; border-radius: 50%; flex: none; display: grid; place-items: center; box-shadow: inset 0 0 0 2px var(--line-strong); }
.choice[aria-checked="true"] .radio { box-shadow: inset 0 0 0 2px var(--coral); }
.choice[aria-checked="true"] .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--coral); }
.c-caret { color: var(--ink-muted); }
.choice[aria-expanded="true"] .c-caret { transform: rotate(180deg); }
.picker { display: grid; gap: 2px; margin: 2px 0 var(--s1) var(--s8); padding-left: var(--s3); border-left: 1px solid var(--line); }
.picker .choice { min-height: 48px; font-size: var(--fs-control); }
.picker .choice .avatar { width: 24px; height: 24px; font-size: var(--fs-tag); }
.picker .choice[aria-checked="true"] .avatar { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--coral); }
.picker .choice:disabled .avatar { opacity: 0.4; }

/* M1 new bill */
#newDlg { margin: auto; width: min(400px, calc(100% - 32px)); }
#newDlg h2 { font-size: var(--fs-title); font-weight: 600; margin-bottom: var(--s2); }
#newDlg p { color: var(--ink-muted); }
.actions { display: flex; flex-direction: column; gap: var(--s2); margin-top: var(--s6); }
@media (min-width: 600px) {
  .actions { flex-direction: row-reverse; justify-content: flex-start; }
}

/* ---------- Motion. Only when the viewer allows it ---------- */
@media (prefers-reduced-motion: no-preference) {
  .btn, .icon-btn, .tap, .choice, .mode label, .row { transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease; }
  #ring .labels { transition: opacity 180ms ease; }
  #ring .seg, #ring .leader { transition: opacity 140ms ease; }
  dialog[open] .panel { animation: rise 180ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  .choice .c-caret { transition: transform 140ms ease; }
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- Prototype states. Not part of the design ---------- */
.proto-tab {
  position: fixed; left: 0; bottom: 120px; z-index: 30;
  width: 16px; height: 136px; padding: 0;
  writing-mode: vertical-rl; transform: rotate(180deg);
  border: 1px dashed #1C1C1F; border-right: 0; border-radius: 6px 0 0 6px;
  background: #E8E4DA; color: #1C1C1F;
  font: 600 10px/1 var(--mono); letter-spacing: 0.02em;
}
.proto-tab:focus-visible { outline: 2px solid #E8E4DA; outline-offset: 2px; }
.proto-panel {
  position: fixed; left: 22px; bottom: 16px; z-index: 31;
  width: min(300px, calc(100vw - 38px)); max-height: calc(100dvh - 32px); overflow: auto;
  background: #F1EEE6; color: #1C1C1F; border: 1px dashed #1C1C1F; border-radius: 8px;
  padding: 10px; font: 13px/1.35 var(--mono);
}
.proto-panel .pp-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
.proto-panel .pp-head p { font-weight: 700; }
.proto-panel .pp-sub { font-size: 12px; color: #4A4740; margin-bottom: 8px; }
.proto-panel button {
  display: block; width: 100%; min-height: 34px; padding: 6px 8px; text-align: left;
  border: 0; border-radius: 4px; background: transparent; color: inherit; font: inherit;
}
.proto-panel button:hover { background: #E0DBCF; }
.proto-panel button[aria-current="true"] { background: #1C1C1F; color: #F1EEE6; }
.proto-panel .pp-close { width: auto; min-height: 28px; padding: 2px 8px; border: 1px solid #1C1C1F; }
.proto-panel button:focus-visible { outline: 2px solid #1C1C1F; outline-offset: 1px; }
</style>

<script>
(() => {
  "use strict";

  // ---------- small helpers ----------
  const $ = (sel, root = document) => root.querySelector(sel);
  const SVGNS = "http://www.w3.org/2000/svg";
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

  function build(make, tag, attrs, kids) {
    const node = make(tag);
    for (const [key, value] of Object.entries(attrs || {})) {
      if (value === false || value === null || value === undefined) continue;
      if (key.startsWith("on") && typeof value === "function") node.addEventListener(key.slice(2), value);
      else if (value === true) node.setAttribute(key, "");
      else node.setAttribute(key, String(value));
    }
    for (const kid of kids.flat()) {
      if (kid === null || kid === undefined || kid === false) continue;
      node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return node;
  }
  const h = (tag, attrs, ...kids) => build((t) => document.createElement(t), tag, attrs, kids);
  const sv = (tag, attrs, ...kids) => build((t) => document.createElementNS(SVGNS, t), tag, attrs, kids);
  const icon = (name, cls = "ph") => sv("svg", { class: cls, "aria-hidden": "true", focusable: "false" }, sv("use", { href: "#i-" + name }));

  // ---------- money in whole cents ----------
  const fig = (c) => Math.floor(c / 100).toLocaleString("en-US") + "." + String(c % 100).padStart(2, "0");
  const rm = (c) => "RM " + fig(c);
  const pct = (bp) => String(bp / 100) + "%";
  function parseAmount(text) {
    const t = (text || "").trim();
    if (!t) return { empty: true };
    if (!/^\d{1,5}(\.\d{1,2})?$/.test(t)) return { error: true };
    const [whole, part = ""] = t.split(".");
    const cents = Number(whole) * 100 + Number((part + "00").slice(0, 2));
    if (cents <= 0 || cents > 9999999) return { error: true };
    return { ok: true, cents };
  }
  function parseRate(text, max) {
    const t = (text || "").trim();
    if (!/^\d{1,2}(\.\d{1,2})?$/.test(t)) return { error: true };
    const [whole, part = ""] = t.split(".");
    const bp = Number(whole) * 100 + Number((part + "00").slice(0, 2));
    if (bp > max * 100) return { error: true };
    return { ok: true, bp };
  }

  // ---------- state ----------
  let S = null;
  let touched = new Set();
  let LAST = null;
  let uid = 100;
  const nextId = (p) => p + (uid++);

  function k1() {
    return {
      mode: "item",
      people: [{ id: "a", name: "Aisyah", c: 0 }, { id: "b", name: "Ben", c: 1 }, { id: "c", name: "Chen", c: 2 }],
      subtotal: "100.00",
      items: [
        { id: "i1", name: "Nasi lemak ayam", price: "15.90", who: ["a"] },
        { id: "i2", name: "Char kuey teow", price: "13.50", who: ["b"] },
        { id: "i3", name: "Mee goreng mamak", price: "12.00", who: ["c"] },
        { id: "i4", name: "Satay, 10 sticks", price: "18.00", who: ["a", "c"] },
      ],
      service: "10", sst: "6",
      spare: { mode: "top", one: null, perm: [] },
      note: null, status: null,
    };
  }
  function fresh() {
    return {
      mode: "even",
      people: [{ id: "p1", name: "", c: 0 }, { id: "p2", name: "", c: 1 }],
      subtotal: "", items: [], service: "10", sst: "6",
      spare: { mode: "top", one: null, perm: [] },
      note: null, status: null,
    };
  }

  const colorVar = (id) => {
    const p = S.people.find((x) => x.id === id);
    return "--p" + ((p ? p.c : 0) + 1);
  };
  const displayName = (p, i) => p.name.trim() || "Person " + (i + 1);
  const nameOf = (id) => { const i = S.people.findIndex((p) => p.id === id); return i < 0 ? "" : displayName(S.people[i], i); };
  function tags() {
    const firsts = S.people.map((p, i) => Array.from(displayName(p, i))[0].toUpperCase());
    const dup = new Set(firsts).size !== firsts.length;
    return firsts.map((f, i) => (dup ? String(i + 1) : f));
  }
  const tagOf = (id) => tags()[S.people.findIndex((p) => p.id === id)];

  function shuffle(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---------- the bill maths (whole cents, the 1.0 rules plus the v1.1.0 spare sen choice) ----------
  function compute() {
    const ids = S.people.map((p) => p.id);
    const errors = new Set();
    const svc = parseRate(S.service, 30);
    const sst = parseRate(S.sst, 20);
    if (!svc.ok) errors.add("service");
    if (!sst.ok) errors.add("sst");
    let sub = 0;
    const prices = {};
    if (S.mode === "even") {
      const a = parseAmount(S.subtotal);
      if (a.error) errors.add("subtotal");
      if (!a.ok) return { kind: "empty", msg: "Enter the subtotal to see the shares.", errors };
      sub = a.cents;
    } else {
      if (!S.items.length) return { kind: "empty", msg: "Add an item to see the shares.", errors };
      let missing = false;
      for (const it of S.items) {
        const a = parseAmount(it.price);
        if (a.error) errors.add("price-" + it.id);
        if (!a.ok) missing = true; else prices[it.id] = a.cents;
      }
      if (missing) return { kind: "empty", msg: "Give every item a price to see the shares.", errors };
      sub = S.items.reduce((t, it) => t + prices[it.id], 0);
    }
    if (!svc.ok || !sst.ok) return { kind: "empty", msg: "Check the charges to see the shares.", errors };
    const service = Math.floor((sub * svc.bp + 5000) / 10000);
    const tax = Math.floor(((sub + service) * sst.bp + 5000) / 10000);
    const total = sub + service + tax;
    const bill = { sub, service, tax, total, svcBp: svc.bp, sstBp: sst.bp, sstBase: sub + service };

    if (S.mode === "item") {
      const open = S.items.filter((it) => !it.who.length);
      if (open.length) {
        const msg = open.length === 1
          ? "1 item still needs a person. Tap who had it to see the shares."
          : open.length + " items still need a person. Tap who had each one to see the shares.";
        return { kind: "blocked", bill, msg, errors, open: new Set(open.map((it) => it.id)) };
      }
    }

    const items = {}, charges = {}, sen = {};
    ids.forEach((id) => { items[id] = 0; charges[id] = 0; sen[id] = 0; });
    const onItems = new Set();
    if (S.mode === "item") S.items.forEach((it) => it.who.forEach((id) => onItems.add(id)));
    const canPick = (id) => ids.includes(id) && (S.mode === "even" || onItems.has(id));
    const oneOk = S.spare.mode === "one" && canPick(S.spare.one);
    let spare = 0;
    // Every spare sen follows the one choice for the whole bill
    const give = (rem, eligible, bucket) => {
      if (!rem) return;
      spare += rem;
      if (oneOk) { bucket[S.spare.one] += rem; sen[S.spare.one] += rem; return; }
      let order = eligible;
      if (S.spare.mode === "random") {
        order = S.spare.perm.filter((id) => eligible.includes(id));
        eligible.forEach((id) => { if (!order.includes(id)) order.push(id); });
      }
      for (let k = 0; k < rem; k++) { const id = order[k % order.length]; bucket[id] += 1; sen[id] += 1; }
    };

    if (S.mode === "even") {
      const base = Math.floor(total / ids.length);
      ids.forEach((id) => { items[id] = base; });
      give(total - base * ids.length, ids, items);
      const rows = ids.map((id) => ({ id, items: 0, charges: 0, share: items[id], sen: sen[id] }));
      return { kind: "ok", bill, rows, spare, errors, canPick };
    }
    for (const it of S.items) {
      const who = ids.filter((id) => it.who.includes(id));
      const base = Math.floor(prices[it.id] / who.length);
      who.forEach((id) => { items[id] += base; });
      give(prices[it.id] - base * who.length, who, items);
    }
    const ch = service + tax;
    const eligible = ids.filter((id) => items[id] > 0);
    let used = 0;
    eligible.forEach((id) => { charges[id] = Math.floor((ch * items[id]) / sub); used += charges[id]; });
    give(ch - used, eligible, charges);
    const rows = ids.map((id) => ({ id, items: items[id], charges: charges[id], share: items[id] + charges[id], sen: sen[id] }));
    return { kind: "ok", bill, rows, spare, errors, canPick, chargesTotal: ch };
  }

  // ---------- the ring ----------
  const RING = $("#ring");
  const WRAP = $("#ringWrap");
  const CENTRE = $("#centre");
  let prevAngles = null;
  let tweenId = 0;
  window.__ringIdle = true;

  function pt(cx, cy, r, a) {
    const t = ((a - 90) * Math.PI) / 180;
    return [cx + r * Math.cos(t), cy + r * Math.sin(t)];
  }
  function arc(cx, cy, r, a0, a1) {
    const sweep = a1 - a0;
    if (sweep <= 0.001) return "";
    const f = (n) => n.toFixed(3);
    if (sweep >= 359.999) {
      const [x0, y0] = pt(cx, cy, r, a0);
      const [x1, y1] = pt(cx, cy, r, a0 + 180);
      return `M${f(x0)} ${f(y0)}A${r} ${r} 0 1 1 ${f(x1)} ${f(y1)}A${r} ${r} 0 1 1 ${f(x0)} ${f(y0)}`;
    }
    const [x0, y0] = pt(cx, cy, r, a0);
    const [x1, y1] = pt(cx, cy, r, a1);
    return `M${f(x0)} ${f(y0)}A${r} ${r} 0 ${sweep > 180 ? 1 : 0} 1 ${f(x1)} ${f(y1)}`;
  }
  function geom() {
    const W = Math.max(240, WRAP.clientWidth);
    const wide = W >= 640;
    const Ro = wide ? 134 : Math.min(112, Math.floor(W / 2) - 4);
    const sw = wide ? 30 : 28;
    const H = wide ? 328 : Ro * 2 + 8;
    return { W, H, cx: W / 2, cy: H / 2, Ro, sw, r: Ro - sw / 2, ri: Ro - sw, wide };
  }
  // Arc length is true to each share: the visible ring (360 less the gaps) is split in proportion to the shares
  function anglesFor(segs, total, g) {
    const n = segs.length;
    const gap = n > 1 ? ((4 / g.r) * 180) / Math.PI : 0;
    const avail = 360 - n * gap;
    const out = {};
    let a = gap / 2;
    segs.forEach((row) => {
      const sweep = (avail * row.share) / total;
      out[row.id] = { a0: a, sw: sweep };
      a += sweep + gap;
    });
    return out;
  }
  function focusSeg(id) {
    if (id) RING.setAttribute("data-focus", id); else RING.removeAttribute("data-focus");
    RING.querySelectorAll("[data-id]").forEach((n) => n.classList.toggle("on", n.getAttribute("data-id") === id));
    document.querySelectorAll(".legend .row").forEach((n) => n.classList.toggle("on", n.getAttribute("data-id") === id));
  }

  function renderRing(R, animate) {
    const g = geom();
    RING.setAttribute("viewBox", `0 0 ${g.W} ${g.H}`);
    RING.style.height = g.H + "px";
    const title = RING.querySelector("title");
    RING.replaceChildren(title);
    RING.removeAttribute("data-focus");
    const segs = R.kind === "ok" ? R.rows.filter((row) => row.share > 0) : [];
    const target = segs.length ? anglesFor(segs, R.bill.total, g) : {};
    title.textContent = segs.length
      ? "Shares ring. " + segs.map((row) => nameOf(row.id) + " " + rm(row.share)).join(", ") + ". Total " + rm(R.bill.total) + "."
      : "Shares ring, empty until the shares can be worked out.";

    if (!segs.length) RING.append(sv("circle", { class: "ghost", cx: g.cx, cy: g.cy, r: g.r, "stroke-width": g.sw }));
    const segG = sv("g", { class: "segs" });
    RING.append(segG);
    const paths = {};
    segs.forEach((row) => {
      const p = sv("path", {
        class: "seg", "data-id": row.id, "data-share": row.share, "data-total": R.bill.total,
        "stroke-width": g.sw, style: `stroke: var(${colorVar(row.id)})`,
        onmouseenter: () => focusSeg(row.id), onmouseleave: () => focusSeg(null),
      });
      segG.append(p);
      paths[row.id] = p;
    });

    // Labels: a tag inside each segment, coral spare-sen marks inside the ring, callouts on wide screens
    const lab = sv("g", { class: "labels" });
    RING.append(lab);
    const tg = tags();
    segs.forEach((row) => {
      const t = target[row.id];
      const mid = t.a0 + t.sw / 2;
      const arcLen = ((t.sw * Math.PI) / 180) * g.r;
      if (arcLen >= 22) {
        const [x, y] = pt(g.cx, g.cy, g.r, mid);
        lab.append(sv("text", { class: "ini", x: x.toFixed(2), y: y.toFixed(2), "text-anchor": "middle", "dominant-baseline": "central", "aria-hidden": "true" },
          tg[S.people.findIndex((p) => p.id === row.id)]));
      }
      const k = Math.min(row.sen, 3);
      for (let j = 0; j < k; j++) {
        const [x, y] = pt(g.cx, g.cy, g.ri - 9, mid + (j - (k - 1) / 2) * 7);
        lab.append(sv("circle", { class: "sen-dot", cx: x.toFixed(2), cy: y.toFixed(2), r: 3.5 }));
      }
    });
    if (g.wide && segs.length <= 6) {
      const cos = segs.map((row) => {
        const t = target[row.id];
        const mid = t.a0 + t.sw / 2;
        const side = mid < 180 ? 1 : -1;
        const [px, py] = pt(g.cx, g.cy, g.Ro + 6, mid);
        const [ex, ey] = pt(g.cx, g.cy, g.Ro + 22, mid);
        return { row, side, px, py, ex, ey, y: ey };
      });
      const gapY = 50;
      for (const side of [1, -1]) {
        const L = cos.filter((c) => c.side === side).sort((a, b) => a.y - b.y);
        for (let i = 1; i < L.length; i++) if (L[i].y < L[i - 1].y + gapY) L[i].y = L[i - 1].y + gapY;
        const over = L.length ? L[L.length - 1].y - (g.H - 26) : 0;
        if (over > 0) L.forEach((c) => { c.y -= over; });
        if (L.length && L[0].y < 26) { const d = 26 - L[0].y; L.forEach((c) => { c.y += d; }); }
      }
      cos.forEach((c) => {
        const lx = g.cx + c.side * (g.Ro + 50);
        const anchor = c.side > 0 ? "start" : "end";
        lab.append(sv("polyline", {
          class: "leader", "data-id": c.row.id,
          points: `${c.px.toFixed(1)},${c.py.toFixed(1)} ${c.ex.toFixed(1)},${c.ey.toFixed(1)} ${(lx - c.side * 8).toFixed(1)},${c.y.toFixed(1)}`,
          style: `stroke: var(${colorVar(c.row.id)})`,
        }));
        const nm = sv("text", { class: "co-name", x: lx.toFixed(1), y: (c.y - 6).toFixed(1), "text-anchor": anchor, "aria-hidden": "true" });
        const nameNode = sv("tspan", {}, nameOf(c.row.id));
        nm.append(nameNode);
        if (c.row.sen) nm.append(sv("tspan", { class: "co-sen", dx: 6 }, "+" + c.row.sen + " sen"));
        lab.append(nm);
        const room = (g.W - (g.Ro + 50) * 2) / 2 - g.cx + g.W / 2 - 4;
        const limit = Math.max(80, room);
        while (nm.getComputedTextLength() > limit && nameNode.textContent.length > 2) {
          nameNode.textContent = nameNode.textContent.replace(/…?$/, "").slice(0, -1) + "…";
        }
        lab.append(sv("text", { class: "co-amt", x: lx.toFixed(1), y: (c.y + 17).toFixed(1), "text-anchor": anchor, "aria-hidden": "true" }, rm(c.row.share)));
      });
    }

    const from = prevAngles;
    const draw = (e) => {
      segs.forEach((row) => {
        const t = target[row.id];
        const f = from ? (from[row.id] || { a0: t.a0, sw: 0 }) : { a0: 0, sw: 0 };
        const a0 = f.a0 + (t.a0 - f.a0) * e;
        const sweep = f.sw + (t.sw - f.sw) * e;
        paths[row.id].setAttribute("d", arc(g.cx, g.cy, g.r, a0, a0 + sweep));
      });
    };
    const changed = !from || segs.some((row) => !from[row.id] || Math.abs(from[row.id].a0 - target[row.id].a0) > 0.01 || Math.abs(from[row.id].sw - target[row.id].sw) > 0.01);
    const id = ++tweenId;
    if (animate && !reduceMotion.matches && segs.length && changed) {
      window.__ringIdle = false;
      lab.style.opacity = "0";
      const dur = from ? 320 : 620;
      const t0 = performance.now();
      draw(0);
      const step = (now) => {
        if (id !== tweenId) return;
        const k = Math.min(1, (now - t0) / dur);
        draw(1 - Math.pow(1 - k, 3));
        if (k < 1) requestAnimationFrame(step);
        else { lab.style.opacity = ""; window.__ringIdle = true; }
      };
      requestAnimationFrame(step);
    } else {
      draw(1);
      window.__ringIdle = true;
    }
    prevAngles = target;

    // The centre
    CENTRE.style.top = g.cy + "px";
    CENTRE.style.width = Math.round(2 * g.ri - 16) + "px";
    CENTRE.replaceChildren();
    if (R.bill) {
      const f = fig(R.bill.total);
      CENTRE.append(h("span", { class: "c-label" }, "Total"),
        h("span", { class: "c-fig" + (f.length >= 8 ? " long" : "") }, h("span", { class: "c-unit" }, "RM"), f));
    } else {
      CENTRE.append(h("span", { class: "c-msg" }, R.msg));
    }
    return target;
  }

  function glyph(id, t) {
    const svg = sv("svg", { class: "glyph", viewBox: "0 0 36 36", "aria-hidden": "true" });
    svg.append(sv("circle", { class: "g-track", cx: 18, cy: 18, r: 15, "stroke-width": 4 }));
    if (t) svg.append(sv("path", { class: "g-arc", d: arc(18, 18, 15, t.a0, t.a0 + t.sw), "stroke-width": 4, style: `stroke: var(${colorVar(id)})` }));
    svg.append(sv("text", { x: 18, y: 18.5, "text-anchor": "middle", "dominant-baseline": "central" }, tagOf(id)));
    return svg;
  }

  // ---------- result area ----------

        h("span", { class: "sh" }, h("span", { class: "sr-only" }, isItem ? ", share " : ", "), rm(row.share)));
      ol.append(li);
    });
    box.append(ol);

      h("span", { class: "g-check" }, icon("check")),

      isItem ? h("span", { class: "wk" },
        h("span", { class: "it" }, rm(R.bill.sub)), h("span", { class: "op", "aria-hidden": "true" }, " + "), h("span", { class: "ch" }, rm(R.chargesTotal))) : null,

  function renderFieldErrors(R) {
    document.querySelectorAll("[data-err]").forEach((el) => {
      const key = el.getAttribute("data-err");
      const show = R.errors.has(key) && touched.has(key);
      el.hidden = !show;
      const field = document.querySelector(`[data-f="${key}"]`);

  }

  function renderResult(animate = true) {

    LAST = R;
    const angles = renderRing(R, animate);
    renderLegend(R, angles);
    renderSpare(R);
    renderCopy(R);
    renderBill(R);
    renderFieldErrors(R);
  }

  // ---------- notes ----------
  function renderNotes() {

  // ---------- editor ----------

  function renderPeople() {

  function refreshNames() {

    renderResult(false);

  function renderBillInputs() {
    const box = $("#billInputs");
    box.replaceChildren();
    if (S.mode === "even") {
      const input = h("input", { id: "subtotal", inputmode: "decimal", autocomplete: "off", "aria-describedby": "err-subtotal" });

      input.addEventListener("input", () => { S.subtotal = input.value; touched.delete("subtotal"); changed(); renderResult(); });

        h("label", { class: "block-title", for: "subtotal" }, "Subtotal", h("span", { class: "sr-only" }, " in RM")),

  function renderEditor() {

    $("#sst").value = S.sst;

  function addPerson() {
    if (S.people.length >= 12) return;
    const used = new Set(S.people.map((p) => p.c));
    let c = 0;
    while (used.has(c)) c++;
    S.people.push({ id: nextId("p"), name: "", c });
    changed();
    renderPeople();
    renderBillInputs();
    renderResult();
    const inputs = document.querySelectorAll("#plist input");
    if (S.people.length >= 12) $("#plist .person:last-child input").focus(); else inputs[inputs.length - 1].focus();
  }
  function removePerson(id) {
    if (S.people.length <= 2) return;
    S.people = S.people.filter((p) => p.id !== id);
    S.items.forEach((it) => { it.who = it.who.filter((x) => x !== id); });
    if (S.spare.one === id) S.spare = { mode: "top", one: null, perm: [] };
    changed();
    renderPeople();
    renderBillInputs();
    renderResult();
    $("#addPerson").focus();
  }
  function addItem() {
    if (S.items.length >= 50) return;
    S.items.push({ id: nextId("i"), name: "", price: "", who: [] });
    changed();
    renderBillInputs();
    renderResult();
    const names = document.querySelectorAll(".item-top .field:first-child input");

    renderResult();

  // ---------- popups ----------

  });

  function placeSpare() {
    if (!window.matchMedia("(min-width: 640px)").matches) { spareDlg.style.top = ""; spareDlg.style.left = ""; return; }
    const btn = $("#spareBtn");
    if (!btn) return;
    const r = btn.getBoundingClientRect();
    const w = spareDlg.offsetWidth || 340;
    const hgt = spareDlg.offsetHeight || 300;
    let top = r.bottom + 8;
    if (top + hgt > window.innerHeight - 16) top = Math.max(16, r.top - 8 - hgt);
    const left = Math.min(Math.max(16, r.right - w), window.innerWidth - w - 16);
    spareDlg.style.top = top + "px";
    spareDlg.style.left = left + "px";
  }
  function renderChoices() {
    const R = LAST;
    $("#spareTitle").textContent = (R && R.spare ? R.spare : 0) + " sen left over";
    const box = $("#choices");
    box.replaceChildren();
    const choice = (value, label) => h("button", {
      class: "choice", type: "button", role: "radio", "data-v": value,
      "aria-checked": String(S.spare.mode === value && (value !== "one" || (R && R.canPick && R.canPick(S.spare.one)))),

    box.append(choice("top", "Top of the list"), choice("one", "One person"));
    if (pickerOpen) {
      const pick = h("div", { class: "picker", role: "radiogroup", "aria-label": "Who pays the spare sen", id: "picker" });
      S.people.forEach((p) => {
        const ok = R && R.canPick ? R.canPick(p.id) : false;
        pick.append(h("button", {
          class: "choice", type: "button", role: "radio", "data-person": p.id, disabled: !ok,
          "aria-checked": String(S.spare.mode === "one" && S.spare.one === p.id),
          onclick: () => { S.spare = { mode: "one", one: p.id, perm: S.spare.perm }; changed(); spareDlg.close(); renderResult(); focusSpareBtn(); },
        }, h("span", { class: "avatar", style: `--pc: var(${colorVar(p.id)})`, "aria-hidden": "true" }, tagOf(p.id)), h("span", { class: "c-txt" }, nameOf(p.id))));
      });
      box.append(pick);
    }
    box.append(choice("random", "At random"));
  }
  function focusSpareBtn() { const b = $("#spareBtn"); if (b) b.focus(); }
  function choose(value) {
    if (value === "one") {
      pickerOpen = !pickerOpen;
      renderChoices();
      placeSpare();
      const first = pickerOpen ? $("#picker .choice:not(:disabled)") : $('#choices [data-v="one"]');
      if (first) first.focus();
      return;
    }
    if (value === "top") S.spare = { mode: "top", one: null, perm: S.spare.perm };
    if (value === "random") S.spare = { mode: "random", one: null, perm: shuffle(S.people.map((p) => p.id)) };
    changed();
    spareDlg.close();
    renderResult();
    focusSpareBtn();
  }
  function openSpare() {
    if (!LAST || LAST.kind !== "ok" || !LAST.spare) return;
    pickerOpen = S.spare.mode === "one";
    renderChoices();
    spareDlg.showModal();
    placeSpare();
    const cur = $('#choices .choice[aria-checked="true"]') || $("#choices .choice");
    cur.focus();
  }
  function pickAgain() {
    S.spare.perm = shuffle(S.people.map((p) => p.id));
    changed();
    renderResult();
    const b = $("#pickAgain");
    if (b) b.focus();
  }
  window.addEventListener("resize", () => { if (spareDlg.open) placeSpare(); });

  $("#newBill").addEventListener("click", () => newDlg.showModal());
  $("#confirmNew").addEventListener("click", () => {
    newDlg.close();
    load(fresh());
    $("#newBill").focus();
  });
  $("#copyBtn").addEventListener("click", () => {
    // Prototype: shows the status only. The real app writes the summary to the clipboard.
    S.status = "ok";
    renderCopy(LAST);
  });

  // ---------- editor wiring ----------
  document.querySelectorAll('#mode input[name="mode"]').forEach((r) => r.addEventListener("change", () => {
    S.mode = r.value;
    changed();
    renderBillInputs();
    renderResult();
  }));
  $("#addPerson").addEventListener("click", addPerson);
  [["#svc", "service"], ["#sst", "sst"]].forEach(([sel, key]) => {
    const input = $(sel);
    input.addEventListener("input", () => { S[key] = input.value; changed(); renderResult(); });
  });

  // ---------- loading a state ----------
  function load(state, opts = {}) {
    S = state;
    touched = new Set(opts.touched || []);
    pickerOpen = false;
    renderNotes();
    renderEditor();
    renderResult(opts.animate !== false);
  }

  const PRESETS = [
    ["K1", "K1 By item (key screen)", () => load(k1())],
    ["K2", "K2 Even split", () => load(Object.assign(k1(), { mode: "even" }))],
    ["P1", "P1 Spare sen choice", () => { load(k1(), { animate: false }); openSpare(); }],
    ["M1", "M1 New bill dialog", () => { load(k1(), { animate: false }); newDlg.showModal(); }],
    ["S1", "S1 First open", () => load(fresh())],
    ["S2", "S2 Amount error", () => load(Object.assign(k1(), { mode: "even", subtotal: "12.505" }), { touched: ["subtotal"] })],
    ["S3", "S3 Item needs a person", () => { const s = k1(); s.items[3].who = []; load(s); }],
    ["S4a", "S4 Summary copied", () => load(Object.assign(k1(), { status: "ok" }))],
    ["S4b", "S4 Copy blocked", () => load(Object.assign(k1(), { status: "fail" }))],
    ["S5", "S5 Save warning", () => load(Object.assign(k1(), { note: "save" }))],
    ["S6", "S6 Saved bill unreadable", () => load(Object.assign(fresh(), { note: "unread" }))],
    ["S7", "S7 12 people reached", () => {
      const s = Object.assign(k1(), { mode: "even" });
      for (let i = 3; i < 12; i++) s.people.push({ id: "q" + i, name: "", c: i });
      load(s);
    }],
    ["W1", "W1 Large bill at 360 px", () => {
      const s = k1();
      s.items.push({ id: "i5", name: "Seafood platter", price: "964.50", who: ["a", "b", "c"] });
      load(s);
    }],
  ];
  window.__loadState = (key) => { const p = PRESETS.find((x) => x[0] === key); if (p) { closeProto(); p[2](); markProto(key); } };

  const protoTab = $("#protoTab");
  const protoPanel = $("#protoPanel");
  let protoCurrent = "K1";
  function markProto(key) {
    protoCurrent = key;
    document.querySelectorAll("#protoList button").forEach((b) => b.setAttribute("aria-current", String(b.getAttribute("data-k") === key)));
  }
  function openProto() { protoPanel.hidden = false; protoTab.setAttribute("aria-expanded", "true"); const cur = $(`#protoList [data-k="${protoCurrent}"]`); if (cur) cur.focus(); }
  function closeProto() { protoPanel.hidden = true; protoTab.setAttribute("aria-expanded", "false"); }
  PRESETS.forEach(([key, label]) => {
    $("#protoList").append(h("button", { type: "button", "data-k": key, onclick: () => window.__loadState(key) }, label));
  });
  protoTab.addEventListener("click", () => (protoPanel.hidden ? openProto() : closeProto()));
  $("#protoClose").addEventListener("click", () => { closeProto(); protoTab.focus(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !protoPanel.hidden && !spareDlg.open && !newDlg.open) { closeProto(); protoTab.focus(); } });

  // Keep the ring true to its box when the width changes
  let lastW = 0;
  new ResizeObserver(() => {
    const w = WRAP.clientWidth;
    if (w && w !== lastW && LAST) { lastW = w; const a = renderRing(LAST, false); renderLegend(LAST, a); }
  }).observe(WRAP);

  load(k1());
  markProto("K1");
})();
</script>
</body>
</html>
