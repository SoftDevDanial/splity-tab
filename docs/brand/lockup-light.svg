<!-- Split lockup for light pages.
     Ink #141917 on white #ffffff = 17.8:1, on the app page #EEF0EE = 15.5:1 (WCAG 2 relative luminance).
     Mark spans baseline to ascender. Wordmark is live text in the system UI stack, weight 700, tracking -0.01em. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 202 64" width="202" height="64" role="img" aria-labelledby="split-lockup-light-title">
  <title id="split-lockup-light-title">Split</title>
  <path fill="#141917" d="M0 4h32v12H0zM40 4h16v12H40zM0 36h56v12H0z"/>
  <text x="77" y="48" textLength="125" lengthAdjust="spacing" fill="#141917" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-0.6">Split</text>
</svg>
