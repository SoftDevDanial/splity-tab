       mark     #F3F5F4 (on-ink token, L = 0.909) = 17.3:1, needs 3:1
       wordmark #F3F5F4 (on-ink token, L = 0.909) = 17.3:1, above 4.5:1 although logotypes are exempt (WCAG 1.4.3)
     Mark spans baseline to ascender. Wordmark is live text in the system UI stack, weight 700, tracking -0.01em. -->
