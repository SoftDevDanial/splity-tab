<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 28 28" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M2,21V4A3,3,0,0,1,5,1H23A3,3,0,0,1,26,4V24L21.5,26L16.5,22.5L12,26.5L9,22L6,25.5ZM4,20.24L5.97,22.46L8.51,19.5L9.74,19.5L12.39,23.48L16.35,19.96L21.72,23.71L24,22.7V4A1,1,0,0,0,23,3H5A1,1,0,0,0,4,4ZM8.5,7H13.5A1.5,1.5,0,0,1,13.5,10H8.5A1.5,1.5,0,0,1,8.5,7ZM18.5,7H19.5A1.5,1.5,0,0,1,19.5,10H18.5A1.5,1.5,0,0,1,18.5,7ZM8.5,12H19.5A1.5,1.5,0,0,1,19.5,15H8.5A1.5,1.5,0,0,1,8.5,12Z"/></svg>
      <h1 class="word">Splity Tab</h1>
    </div>
    <div class="notes" id="notes"></div>
    <button type="button" class="btn btn-ghost" id="newBill" aria-haspopup="dialog">New bill</button>
  </header>

  <main class="layout">
    <section class="stage" id="stage" aria-label="Bill and splits">
      <article class="glass card" id="card">
        <div class="foil" aria-hidden="true"></div>
        <div class="rbody" id="rbody"></div>
      </article>
    </section>
    <section class="work" id="work" aria-label="Edit the bill"></section>
  </main>

  <div class="strip glass dense" id="strip">
    <div class="foil" aria-hidden="true"></div>
    <div class="strip-in">
      <div class="strip-top">
        <div class="strip-info" id="stripInfo"></div>
        <p class="status" id="stripStatus" role="status"></p>
      </div>
      <div class="strip-acts">
        <button type="button" class="btn btn-ghost" id="splitsBtn" aria-haspopup="dialog" aria-controls="splitsDlg" aria-expanded="false">Splits</button>
        <button type="button" class="btn btn-primary" id="stripCopy">Copy summary</button>
      </div>
    </div>
  </div>
</div>

<dialog class="sheet-dlg" id="splitsDlg" aria-label="Splits"></dialog>
<dialog class="pop" id="spareDlg" aria-labelledby="spareTitle" aria-describedby="spareSub"></dialog>
<dialog class="modal" id="newDlg" aria-labelledby="newTitle" aria-describedby="newBody">
  <div class="in">
    <h2 id="newTitle">Start a new bill?</h2>
    <p id="newBody">This clears the people, items and amounts.</p>
    <div class="acts">
      <button type="button" class="btn btn-danger btn-lg" id="startNew">Start new bill</button>
      <button type="button" class="btn btn-ghost btn-lg">Cancel</button>
    </div>
  </div>
</dialog>

</body>
</html>
